name: Validate ML lab
on:
  push:
    paths: ['pipeline.py', 'requirements.txt', 'lab/**', 'tests/**', '.github/workflows/validate-lab.yml']
  pull_request:
    paths: ['pipeline.py', 'requirements.txt', 'lab/**', 'tests/**', '.github/workflows/validate-lab.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/lab.test.js
